services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-elections}
      DB_USERNAME: ${MYSQL_USER:-elections}
      DB_PASSWORD: ${MYSQL_PASSWORD:-elections_dev_only}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-800}
      OPENROUTER_TEMPERATURE: ${OPENROUTER_TEMPERATURE:-0.2}
      OPENROUTER_MAX_STEPS: ${OPENROUTER_MAX_STEPS:-5}
      OPENROUTER_HISTORY_MESSAGES: ${OPENROUTER_HISTORY_MESSAGES:-6}
      OPENROUTER_INPUT_COST_PER_MILLION: ${OPENROUTER_INPUT_COST_PER_MILLION:-0}
      OPENROUTER_OUTPUT_COST_PER_MILLION: ${OPENROUTER_OUTPUT_COST_PER_MILLION:-0}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      CACHE_PAST_ELECTION_TTL_SECONDS: ${CACHE_PAST_ELECTION_TTL_SECONDS:-31536000}
      CACHE_ACTIVE_ELECTION_TTL_SECONDS: ${CACHE_ACTIVE_ELECTION_TTL_SECONDS:-300}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-elections}
      MYSQL_USER: ${MYSQL_USER:-elections}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-elections_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql

volumes:
  mysql_data:
  vendor_data: